name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build zip and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version metadata.json)
          ZIP="Balatro-Preview-v${VERSION}.zip"
          mkdir -p stage/Balatro-Preview
          rsync -a --exclude='.git' --exclude='.github' --exclude='gifs' --exclude='release-notes' --exclude='stage' ./ stage/Balatro-Preview/
          find stage -name .git -prune -exec rm -rf {} +
          (cd stage && zip -r "../$ZIP" Balatro-Preview)
          unzip -l "$ZIP" | tail -n 30
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ZIP" --clobber
          else
            gh release create "v${VERSION}" "$ZIP" --target "${GITHUB_SHA}" --title "Preview v${VERSION}" --notes-file "release-notes/v${VERSION}.md"
          fi
